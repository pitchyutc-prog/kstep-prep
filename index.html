<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="K-StEP Prep">
<title>K-StEP Prep</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#111827;--muted:#4b5563;--pri:#1f5fbf;--pri-ink:#fff;--soft:#e8f0fc;--ok:#137a45;--ok-bg:#e3f5ea;--bad:#b42318;--bad-bg:#fdeceb;--warn:#9a5b00;--line:#d9dee5;--r:14px;--shadow:0 1px 3px rgba(0,0,0,.06)}
[data-theme="dark"]{--bg:#0e1217;--card:#171d25;--text:#e9eef4;--muted:#a7b1bd;--pri:#7fa8ff;--pri-ink:#0b1220;--soft:#1c2736;--ok:#5ad391;--ok-bg:#12291d;--bad:#ff8a80;--bad-bg:#2e1716;--warn:#f5c04d;--line:#2a333f;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",Sarabun,sans-serif;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
h1{font-size:1.5rem;margin:.2em 0 .4em;line-height:1.3}
h2{font-size:1.2rem;margin:1.2em 0 .5em}
h3{font-size:1.06rem;margin:0 0 .4em}
p{margin:.4em 0}
.muted{color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.ghost{background:transparent}
.btn.flagged{border:2px solid var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active,.mode:active,.choice:active{transform:scale(.985)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack>*+*{margin-top:8px}
.space{height:10px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin:10px 0;cursor:pointer;min-height:80px;box-shadow:var(--shadow)}
.mode:disabled{opacity:.5;cursor:default}
.mode .ic{font-size:1.6rem;width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.mode b{display:block;font-size:1.06rem}
.mode .muted{display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--text);font:inherit;text-align:left}
.stat .v{font-size:1.45rem;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font:inherit;font-size:16px;display:flex;flex-direction:column;align-items:center;padding:4px 2px;min-height:58px;border-radius:10px;cursor:pointer;white-space:nowrap}
.nav .i{font-size:1.3rem;line-height:1.3}
.nav button.on{color:var(--pri);font-weight:700;background:var(--soft)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bar .btn{min-height:56px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:-16px -16px 8px;padding:10px 16px}
.iconbtn{min-width:52px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:1.1rem;cursor:pointer}
.iconbtn:disabled{opacity:.45}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .2s}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.passage{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:14px;margin:8px 0;max-height:45vh;overflow:auto}
.q{font-size:1.1rem;font-weight:600;margin:12px 0}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;margin:8px 0;min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.choice.sel{border-color:var(--pri);background:var(--soft)}
.choice.sel .k{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-left:4px solid var(--pri);padding:10px 12px;background:var(--card);border-radius:8px;margin:10px 0}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.audio{display:flex;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.grid button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;position:relative}
.grid button.ans{background:var(--soft);border-color:var(--pri)}
.grid button.cur{outline:3px solid var(--pri)}
.grid button.flag{border:2px solid var(--warn)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0}
.hbar .lbl{flex:0 0 42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--pri)}
.hbar .val{flex:none;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.linkrow{width:100%;background:none;border:0;color:inherit;font:inherit;padding:6px 0;text-align:left;min-height:52px;cursor:pointer}
.chart{width:100%;height:auto;display:block}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task label{display:flex;gap:12px;align-items:center;flex:1;min-height:44px;cursor:pointer}
.task input{width:26px;height:26px;accent-color:var(--pri);flex:none}
.task .btn{width:auto;min-height:52px;flex:none}
.day.past{opacity:.6}
.day.today{border:2px solid var(--pri)}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.flash .w{font-size:2rem;font-weight:700}
input[type=date],input[type=text]{width:100%;min-height:52px;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-width:0;min-height:52px;border:0;background:var(--card);color:var(--text);font:inherit;cursor:pointer;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--pri);color:var(--pri-ink);font-weight:700}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.big{font-size:2.6rem;font-weight:800;line-height:1.15}
details summary{cursor:pointer;min-height:52px;display:flex;align-items:center;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
/* ---- Friends (Phase A) ---- */
.codein{text-transform:uppercase;letter-spacing:.3em;font-weight:700;text-align:center}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.avopt{position:relative;display:block}
.avopt input{position:absolute;opacity:0;width:1px;height:1px}
.avopt span{display:grid;place-items:center;height:56px;font-size:1.7rem;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.avopt input:checked+span{border-color:var(--pri);background:var(--soft)}
.avopt input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
.pchip{display:flex;align-items:center;gap:10px}
.avbig{font-size:2rem;width:56px;height:56px;display:grid;place-items:center;background:var(--soft);border-radius:50%;flex:none}
.lb{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb.me{background:var(--soft);border-radius:12px;padding:10px 8px;margin:0 -8px}
.lb .rk{flex:0 0 34px;text-align:center;font-weight:700}
.lb .av{flex:0 0 40px;height:40px;display:grid;place-items:center;font-size:1.5rem;background:var(--soft);border-radius:50%}
.lb .lbm{flex:1;min-width:0}
.lb .pts{flex:none;text-align:right;line-height:1.2}
.lb .pts b{display:block;font-size:1.15rem}
.lb .iconbtn{flex:none}
.codebox{font:700 2rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.25em;text-align:center;padding:10px;margin:6px 0 10px;border:2px dashed var(--line);border-radius:12px;user-select:all}
.cheers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.switch{display:flex;gap:12px;align-items:flex-start;min-height:52px;cursor:pointer}
.switch input{width:26px;height:26px;flex:none;accent-color:var(--pri);margin-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.btn:active,.mode:active,.choice:active{transform:none}}
</style>
</head>

const $ = s => document.querySelector(s);
const app = $('#app');
const LET = ['A', 'B', 'C', 'D'];
const STORE_KEY = 'kstep-progress-v1', SESSION_KEY = 'kstep-session-v1';

function defaultState(){ return { v:1, settings:{ lang:'th', theme:'system' }, attempts:[], mistakes:{}, topics:{}, activity:{}, plan:{ examDate:'', start:'', done:{} }, cards:{} }; }
function loadState(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(!raw) return defaultState();
    const d = defaultState();
    return { ...d, ...raw, settings:{ ...d.settings, ...raw.settings }, plan:{ ...d.plan, ...raw.plan } };
  }catch(e){ return defaultState(); }
}

function t(k, ...a){
  let s = (I18N[S.settings.lang] || I18N.en)[k];
  if(s === undefined) s = I18N.en[k];
  if(s === undefined) return k;
  return s.replace(/\{(\d)\}/g, (_, i) => a[i]);
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const z2 = n => String(n).padStart(2, '0');
function dstr(d = new Date()){ return d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate()); }
function addDays(ds, n){ const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); }
function diffDays(a, b){ return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
function fmtDate(ds){ return new Date(ds + 'T00:00:00').toLocaleDateString(S.settings.lang === 'th' ? 'th-TH' : 'en-GB', { weekday:'short', day:'numeric', month:'short' }); }
function fmtTime(ms){ ms = Math.max(0, ms); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + z2(m) : m) + ':' + z2(s % 60); }
const fmt1 = x => String(Math.round(x * 10) / 10);
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2400); }
const totalCount = () => CONFIG.parts.reduce((s, p) => s + p.count, 0);
const partById = id => CONFIG.parts.find(p => p.id === Number(id));
const partPoints = p => CONFIG.totalPoints * p.count / totalCount();
const pName = p => S.settings.lang === 'th' ? p.th : p.en;
const countPart = id => BANK.questions.filter(q => q.part === id).length;
const stat = (label, val, click) => `<${click ? 'button' : 'div'} class="stat" ${click ? `onclick="${click}"` : ''}><div class="muted">${label}</div><div class="v">${val}</div></${click ? 'button' : 'div'}>`;
const hbar = (label, frac, val) => `<div class="hbar"><span class="lbl">${esc(label)}</span><span class="track"><i style="width:${Math.round(frac * 100)}%"></i></span><span class="val">${val}</span></div>`;

/* =========================================================
   4) QUESTION BANK
   ========================================================= */
let BANK = { questions:[], vocab:[] }, QMAP = new Map(), bankErr = '';
function validQ(q){ return q && q.id && partById(q.part) && q.question && Array.isArray(q.choices) && q.choices.length === 4 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < 4; }
async function loadBank(){
  bankErr = '';
  try{
    const r = await fetch(CONFIG.questionsUrl, { cache:'no-cache' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const qs = (Array.isArray(j) ? j : (j.questions || [])).map(q => ({ ...q, part:Number(q.part) }));
    BANK.questions = qs.filter(validQ);
    BANK.vocab = Array.isArray(j) ? [] : (j.vocab || []).filter(v => v && v.word);
    if(qs.length !== BANK.questions.length) console.warn((qs.length - BANK.questions.length) + ' invalid question(s) skipped');
  }catch(e){ bankErr = String(e.message || e); }
  QMAP = new Map(BANK.questions.map(q => [q.id, q]));
}

function saveSession(){ if(session) localStorage.setItem(SESSION_KEY, JSON.stringify(session)); else localStorage.removeItem(SESSION_KEY); }
function loadSession(){
  try{ const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); if(s && s.ids && s.ids.length && s.ids.every(id => QMAP.has(id))) return s; }catch(e){}
  return null;
}
const curQ = () => QMAP.get(session.ids[session.idx]);

function startSession(mode, part, topic){
  if(!session && loadSession() && !confirm(t('overwrite'))) return;
  const byPart = id => BANK.questions.filter(q => q.part === id);
  let ids = [], minutes = 0;
  if(mode === 'practice') ids = shuffle(byPart(part)).slice(0, CONFIG.practiceSize).map(q => q.id);
  else if(mode === 'part'){ const p = partById(part); ids = shuffle(byPart(part)).slice(0, p.count).map(q => q.id); minutes = p.minutes * ids.length / p.count; }
  else if(mode === 'mock'){ CONFIG.parts.forEach(p => ids.push(...shuffle(byPart(p.id)).slice(0, p.count).map(q => q.id))); minutes = CONFIG.totalMinutes * ids.length / totalCount(); }
  else if(mode === 'review') ids = shuffle(Object.keys(S.mistakes).filter(id => QMAP.has(id))).sort((a, b) => QMAP.get(a).part - QMAP.get(b).part);
  else if(mode === 'topic') ids = shuffle(BANK.questions.filter(q => (q.topic || 'General') === topic)).slice(0, CONFIG.practiceSize).map(q => q.id);
  if(!ids.length){ toast(t('noQuestions')); return; }
  stopAudio();
  session = { mode, part:part || null, topic:topic || null, ids, idx:0, answers:{}, flags:{}, plays:{}, startedAt:Date.now(),
              endAt: minutes ? Date.now() + Math.ceil(minutes * 60000) : 0, feedback: ['practice','review','topic'].includes(mode) };
  saveSession(); showGrid = false; startTimer(); go('exam');
}
function resume(){
  const s = loadSession(); if(!s) return;
  session = s; view = 'exam';
  if(s.endAt && Date.now() >= s.endAt){ submit(true); return; }
  startTimer(); render();
}
function quitSession(){ if(!confirm(t('quitConfirm'))) return; stopAudio(); stopTimer(); session = null; saveSession(); go('home'); }

function explain(q, a){

}
function choose(k){
  const q = curQ();
  if(session.feedback && session.answers[q.id] !== undefined) return;
  session.answers[q.id] = k; saveSession(); render();
  if(session.feedback){ const fb = $('.fb'); if(fb) fb.scrollIntoView({ behavior:'smooth', block:'nearest' }); }

function move(d){ stopAudio(); session.idx = Math.max(0, Math.min(session.ids.length - 1, session.idx + d)); saveSession(); render(); window.scrollTo(0, 0); }
function jump(k){ stopAudio(); session.idx = k; showGrid = false; saveSession(); render(); window.scrollTo(0, 0); }

/* ---------- Audio: <audio> file or speechSynthesis fallback ---------- */
let audioEl = null, audioState = 'idle', audioKind = 'tts', ttsToken = 0;
function maxPlays(){ return (session.mode === 'mock' || session.mode === 'part') ? CONFIG.maxPlaysTimed : CONFIG.maxPlaysPractice; }
function audioLabel(){
  if(audioState === 'playing') return audioKind === 'file' ? '⏸ ' + t('pause') : '⏹ ' + t('stop');
  if(audioState === 'paused') return '▶ ' + t('resume2');
  return '▶ ' + t('play');
}
function audioInner(q){
  const max = maxPlays(), used = session.plays[q.id] || 0, canNew = !max || used < max;
  return `<div class="audio">
    <button class="btn pri" style="flex:2" onclick="audioToggle()" ${audioState === 'idle' && !canNew ? 'disabled' : ''}>${audioLabel()}</button>
    <button class="btn" style="flex:1" onclick="audioReplay()" ${canNew ? '' : 'disabled'}>↺ ${t('replay')}</button></div>
    <p class="muted" style="margin-bottom:0">${max ? t('playsLeft', Math.max(0, max - used), max) : t('unlimited')}${q.audio ? '' : ' · ' + t('ttsNote')}</p>`;
}
function setAudio(st){ audioState = st; const b = $('#audioBox'); if(b && view === 'exam' && session) b.innerHTML = audioInner(curQ()); }
function audioToggle(){
  if(audioState === 'playing'){ if(audioKind === 'file' && audioEl){ audioEl.pause(); setAudio('paused'); } else { stopAudio(); setAudio('idle'); } }
  else if(audioState === 'paused' && audioEl){ audioEl.play(); setAudio('playing'); }
  else startPlay();
}
function audioReplay(){ stopAudio(); startPlay(); }
function startPlay(){
  const q = curQ(), max = maxPlays(), used = session.plays[q.id] || 0;
  if(max && used >= max){ toast(t('noPlays')); return; }
  session.plays[q.id] = used + 1; saveSession();
  if(q.audio){
    let fell = false;
    const fallback = () => { if(fell) return; fell = true; audioEl = null; speakText(q.script || q.question); };
    audioKind = 'file';
    audioEl = new Audio(q.audio);
    audioEl.onended = () => setAudio('idle');
    audioEl.onerror = fallback;
    audioEl.play().then(() => setAudio('playing')).catch(fallback);
  } else speakText(q.script || q.question);
}
function enVoices(){
  if(!('speechSynthesis' in window)) return [];
  const all = speechSynthesis.getVoices();
  const us = all.filter(v => /^en[-_]US/i.test(v.lang));
  return us.length ? us : all.filter(v => /^en/i.test(v.lang));
}
function speakText(text){
  if(!('speechSynthesis' in window)){ toast(t('noTts')); setAudio('idle'); return; }
  speechSynthesis.cancel();
  audioKind = 'tts';
  const tok = ++ttsToken, voices = enVoices(), parts = [];
  String(text).split(/\n+/).filter(s => s.trim()).forEach(line => {
    const m = line.match(/^\s*(M|W|Man|Woman)\s*:\s*/i);
    const who = m ? (/^w/i.test(m[1]) ? 'W' : 'M') : '';
    const body = m ? line.slice(m[0].length) : line;
    (body.match(/[^.!?]+[.!?]*/g) || [body]).forEach(chunk => { if(chunk.trim()) parts.push({ who, text:chunk.trim() }); });
  });
  parts.forEach((pt, k) => {
    const u = new SpeechSynthesisUtterance(pt.text);
    u.lang = 'en-US'; u.rate = CONFIG.ttsRate;
    if(pt.who === 'W'){ u.pitch = 1.2; if(voices[1] || voices[0]) u.voice = voices[1] || voices[0]; }
    else { u.pitch = pt.who === 'M' ? 0.85 : 1; if(voices[0]) u.voice = voices[0]; }
    if(k === parts.length - 1) u.onend = () => { if(tok === ttsToken) setAudio('idle'); };
    speechSynthesis.speak(u);
  });
  setAudio('playing');
}
function stopAudio(){
  ttsToken++;
  if(audioEl){ audioEl.onended = audioEl.onerror = null; audioEl.pause(); audioEl = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  audioState = 'idle';
}

/* ---------- Submit & scoring ---------- */
function toeicRange(frac){
  const mid = 10 + frac * 980;
  return [Math.max(10, Math.round((mid - 60) / 5) * 5), Math.min(990, Math.round((mid + 60) / 5) * 5)];
}
function submit(auto){
  const s = session; if(!s) return;
  const un = s.ids.filter(id => s.answers[id] === undefined).length, fl = Object.keys(s.flags).length;
  if(!auto && !(s.feedback && un === 0) && !confirm(t('submitConfirm', un, fl))) return;
  stopAudio(); stopTimer(); showGrid = false;
  const today = dstr(), perPart = {}, items = [];
  let c = 0;
  s.ids.forEach(id => {
    const q = QMAP.get(id), a = s.answers[id], ok = a === q.answer, tp = q.topic || 'General';
    if(ok) c++;
    const pp = perPart[q.part] || (perPart[q.part] = { c:0, n:0 }); pp.n++; if(ok) pp.c++;
    const tt = S.topics[tp] || (S.topics[tp] = { c:0, n:0 }); tt.n++; if(ok) tt.c++;
    if(ok) delete S.mistakes[id]; else S.mistakes[id] = { n:((S.mistakes[id] || {}).n || 0) + 1, last:today };
    items.push({ id, a });
  });
  const n = s.ids.length;
  let score100 = null;
  if(s.mode === 'mock'){
    let pts = 0, avail = 0;
    CONFIG.parts.forEach(p => { const pp = perPart[p.id]; if(pp && pp.n){ pp.pts = pp.c / pp.n * partPoints(p); pts += pp.pts; avail += partPoints(p); } });
    const k = avail ? CONFIG.totalPoints / avail : 0;
    CONFIG.parts.forEach(p => { if(perPart[p.id]) perPart[p.id].pts *= k; });
    score100 = Math.round(pts * k * 10) / 10;
  }
  const res = { mode:s.mode, part:s.part, topic:s.topic, date:today, ts:Date.now(), c, n, pct:Math.round(c / n * 1000) / 10, score100, perPart };
  S.attempts.push(res);
  if(S.attempts.length > 1000) S.attempts.splice(0, S.attempts.length - 1000);
  S.activity[today] = (S.activity[today] || 0) + n;
  if(s.mode === 'practice' || s.mode === 'part') planAuto('practice:' + s.part);
  else if(s.mode === 'mock' || s.mode === 'review') planAuto(s.mode);
  save();
  queuePractice(items);                     // friends: queue answers for server-side checking
  lastResult = { ...res, items, dur:Date.now() - s.startedAt, auto:!!auto };
  session = null; saveSession(); resFilter = 'wrong';
  go('result');
  afterPracticeSync();
}

function calcStreak(){ let d = dstr(); if(!S.activity[d]) d = addDays(d, -1); let n = 0; while(S.activity[d]){ n++; d = addDays(d, -1); } return n; }
function partAcc(){ const m = {}; S.attempts.forEach(a => Object.entries(a.perPart || {}).forEach(([k, v]) => { const x = m[k] || (m[k] = { c:0, n:0 }); x.c += v.c; x.n += v.n; })); return m; }
function weakTopics(){
  let list = Object.entries(S.topics).map(([k, v]) => ({ k, acc:v.c / v.n, n:v.n }));
  if(list.some(x => x.n >= 2)) list = list.filter(x => x.n >= 2);
  return list.sort((a, b) => a.acc - b.acc || b.n - a.n).slice(0, 5);
}
function chartSVG(){
  const days = 14, W = 340, H = 190, pl = 36, pb = 26, pt = 10, cw = (W - pl - 4) / days, ih = H - pb - pt;
  let g = '';
  [0, .5, 1].forEach(v => { const y = H - pb - ih * v; g += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl - 6}" y="${y + 5}" text-anchor="end">${v * 100}</text>`; });
  for(let k = 0; k < days; k++){
    const d = addDays(dstr(), k - days + 1), at = S.attempts.filter(a => a.date === d);
    const n = at.reduce((s, a) => s + a.n, 0), c = at.reduce((s, a) => s + a.c, 0), x = pl + k * cw;
    if(n){ const hh = Math.max(ih * c / n, 2); g += `<rect x="${x + 3}" y="${H - pb - hh}" width="${cw - 6}" height="${hh}" rx="3" style="fill:var(--pri)"><title>${d}: ${Math.round(c / n * 100)}%</title></rect>`; }
    if((days - 1 - k) % 2 === 0) g += `<text x="${x + cw / 2}" y="${H - 5}" text-anchor="middle">${Number(d.slice(8))}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartAria')}" font-size="16" style="fill:var(--muted)">${g}</svg>`;
}
function vProgress(){
  const n = S.attempts.reduce((s, a) => s + a.n, 0), c = S.attempts.reduce((s, a) => s + a.c, 0);
  const mocks = S.attempts.filter(a => a.mode === 'mock' && a.score100 != null);
  const best = mocks.length ? Math.max(...mocks.map(a => a.score100)) : null;
  let h = `<h1>${t('progress')}</h1><div class="stats">${stat(t('streak'), '🔥 ' + calcStreak())}${stat(t('answeredTotal'), n)}${stat(t('accuracy'), n ? Math.round(c / n * 100) + '%' : '—')}${stat(t('bestMock'), best != null ? fmt1(best) : '—')}</div>`;
  if(!S.attempts.length) return h + `<div class="card"><p>${t('noData')}</p><button class="btn pri" onclick="go('practice')">${t('m1')}</button></div>`;
  h += `<div class="card"><h3>${t('chartTitle')}</h3>${chartSVG()}</div>`;
  const pa = partAcc();
  h += `<div class="card"><h3>${t('partAccTitle')}</h3>${CONFIG.parts.map(p => { const x = pa[p.id]; return hbar(p.icon + ' ' + pName(p), x ? x.c / x.n : 0, x ? Math.round(x.c / x.n * 100) + '%' : '—'); }).join('')}</div>`;
  WEAK = weakTopics();
  h += `<div class="card"><h3>${t('weakTopics')}</h3>${WEAK.map((w, i) => `<button class="hbar linkrow" onclick="startTopic(${i})"><span class="lbl">${esc(w.k)}</span><span class="track"><i style="width:${Math.round(w.acc * 100)}%"></i></span><span class="val">${Math.round(w.acc * 100)}% ›</span></button>`).join('') || `<p class="muted">${t('noData')}</p>`}</div>`;
  h += `<div class="card"><h3>${t('recent')}</h3>${S.attempts.slice(-8).reverse().map(a => `<div class="task"><span>${fmtDate(a.date)}<br><span class="muted">${t('mode_' + a.mode)}${a.part ? ' · ' + t('part') + ' ' + a.part : ''}${a.topic ? ' · ' + esc(a.topic) : ''}</span></span><b style="margin-left:auto">${a.score100 != null ? fmt1(a.score100) + '/' + CONFIG.totalPoints : a.c + '/' + a.n}</b></div>`).join('')}</div>`;
  return h;
}

function planTasks(i, total){
  const left = total - i, T = (k, en, th, act) => ({ k, en, th, act });
  const cards = T('cards', 'Flashcards: due cards', 'ทบทวนแฟลชการ์ดที่ถึงกำหนด', 'cards');
  const review = T('review', 'Review mistakes', 'ทบทวนข้อที่ผิด', 'review');
  if(left === 1) return [T('cards', 'Light review: flashcards only', 'ทบทวนคำศัพท์เบา ๆ', 'cards'), review, T('rest', 'Prepare ID & stationery, sleep early', 'เตรียมบัตร อุปกรณ์ และนอนให้เร็ว', '')];
  if(left <= 3) return [review, T('weak', 'Practice your weakest part', 'ฝึกพาร์ทที่อ่อนที่สุด', 'weak'), cards];
  if(left % 7 === 0) return [T('mock', 'Full mock exam (timed)', 'ทำข้อสอบจำลองเต็มชุด (จับเวลา)', 'mock'), T('review', 'Review mistakes from the mock', 'ทบทวนข้อผิดจากข้อสอบจำลอง', 'review'), cards];
  const p = CONFIG.parts[i % CONFIG.parts.length];
  const extra = {
    1: T('x', 'Shadowing: replay 3 listening items and repeat aloud', 'ฝึก Shadowing: ฟังซ้ำ 3 ข้อแล้วพูดตาม', ''),
    2: T('x', 'Read 1 short English article and note 5 new words', 'อ่านบทความภาษาอังกฤษสั้น ๆ 1 เรื่อง จดคำใหม่ 5 คำ', ''),
    3: T('x', 'Study 1 grammar point from your weakest topics', 'ทบทวนไวยากรณ์ 1 หัวข้อจากหัวข้อที่อ่อน', '')
  }[p.id] || T('x', 'Review your notes', 'ทบทวนโน้ต', '');
  return [T('practice:' + p.id, `Practice Part ${p.id}: ${p.en} (${CONFIG.practiceSize} Qs)`, `ฝึกพาร์ท ${p.id}: ${p.th} (${CONFIG.practiceSize} ข้อ)`, 'practice:' + p.id), cards, extra];
}
function planDays(){
  const { start, examDate } = S.plan;
  if(!start || !examDate) return [];
  const span = diffDays(start, examDate); if(span <= 0) return [];
  const total = Math.min(span, CONFIG.planMaxDays), s0 = addDays(examDate, -total);
  return Array.from({ length:total }, (_, i) => ({ i, date:addDays(s0, i), tasks:planTasks(i, total) }));
}
function setExamDate(){
  const v = $('#examDate').value;
  if(!v || v <= dstr()){ toast(t('planEmpty')); return; }
  S.plan.examDate = v; S.plan.start = dstr(); save(); render();
}
function setDone(date, k, on){
  const a = S.plan.done[date] || (S.plan.done[date] = []), i = a.indexOf(k);
  if(on && i < 0) a.push(k); if(!on && i >= 0) a.splice(i, 1);
  save(); updatePlanProgress();
}
function planAuto(act){
  const d = planDays().find(x => x.date === dstr()); if(!d) return;
  const a = S.plan.done[d.date] || (S.plan.done[d.date] = []);
  d.tasks.forEach(tk => { if((tk.act === act || (tk.act === 'weak' && act.startsWith('practice:'))) && !a.includes(tk.k)) a.push(tk.k); });
}
function runAction(act){
  if(act === 'cards') go('cards');
  else if(act === 'review') startSession('review');
  else if(act === 'mock') go('mockIntro');
  else if(act === 'weak'){ const pa = partAcc(); const p = CONFIG.parts.slice().sort((a, b) => { const x = pa[a.id], y = pa[b.id]; return (x ? x.c / x.n : 0) - (y ? y.c / y.n : 0); })[0]; startSession('practice', p.id); }
  else if(act.startsWith('practice:')) startSession('practice', Number(act.split(':')[1]));
}
function planStats(){ let tot = 0, dn = 0; planDays().forEach(d => { const done = S.plan.done[d.date] || []; tot += d.tasks.length; dn += d.tasks.filter(x => done.includes(x.k)).length; }); return [dn, tot]; }
function updatePlanProgress(){ const el = $('#planProg'); if(!el) return; const [dn, tot] = planStats(); el.querySelector('span').textContent = dn + '/' + tot; el.querySelector('i').style.width = (tot ? dn / tot * 100 : 0) + '%'; }
function dayCard(d){
  const today = dstr(), done = S.plan.done[d.date] || [], lang = S.settings.lang;
  const cls = d.date < today ? 'past' : d.date === today ? 'today' : '';
  return `<div class="card day ${cls}"><b>${fmtDate(d.date)}</b> <span class="muted">· ${t('dayN', d.i + 1)} · ${t('daysLeftN', diffDays(d.date, S.plan.examDate))}</span>
    ${d.tasks.map(tk => `<div class="task"><label><input type="checkbox" ${done.includes(tk.k) ? 'checked' : ''} onchange="setDone('${d.date}','${tk.k}',this.checked)"><span>${esc(tk[lang])}</span></label>
    ${tk.act && d.date === today ? `<button class="btn" onclick="runAction('${tk.act}')">${t('go')}</button>` : ''}</div>`).join('')}</div>`;
}
function vPlan(){
  const today = dstr();
  let h = `<h1>${t('plan')}</h1><div class="card"><label for="examDate"><b>${t('examDate')}</b></label><div class="space"></div>
    <input type="date" id="examDate" value="${esc(S.plan.examDate)}" min="${addDays(today, 1)}"><div class="space"></div>
    <button class="btn pri" onclick="setExamDate()">${t('genPlan')}</button></div>`;
  if(!S.plan.examDate) return h + `<p class="muted">${t('planEmpty')}</p>`;
  if(S.plan.examDate === today) return h + `<div class="card"><b>${t('examToday')}</b></div>`;
  const days = planDays();
  if(S.plan.examDate < today || !days.length) return h + `<p>${t('examPassed')}</p>`;
  const [dn, tot] = planStats();
  h += `<div class="card" id="planProg"><b>${t('planProgress')}</b> <span>${dn}/${tot}</span><div class="prog"><i style="width:${tot ? dn / tot * 100 : 0}%"></i></div>
    ${days[0].date > today ? `<p class="muted">${t('planStarts', fmtDate(days[0].date))}</p>` : ''}</div>`;
  const td = days.find(d => d.date === today);
  if(td) h += `<h2>${t('today')}</h2>` + dayCard(td);
  const next = days.filter(d => d.date > today).slice(0, 6);
  if(next.length) h += `<h2>${t('upcoming')}</h2>` + next.map(dayCard).join('');
  h += `<details class="card"><summary>${t('showAll')} (${days.length})</summary>${days.map(dayCard).join('')}</details>`;
  return h;
}

function syncCards(){
  const today = dstr();
  let added = Object.values(S.cards).filter(c => c.added === today).length;
  BANK.vocab.forEach(v => { if(S.cards[v.word] || added >= CONFIG.newCardsPerDay) return; S.cards[v.word] = { box:1, due:today, added:today }; added++; });
  save();
}
function dueCards(){ const today = dstr(); return BANK.vocab.filter(v => S.cards[v.word] && S.cards[v.word].due <= today); }
function startCards(all){
  syncCards();
  const list = all ? BANK.vocab.filter(v => S.cards[v.word]) : dueCards();
  if(!list.length){ toast(t('noDue')); return; }
  cardQ = shuffle(list); cardFlip = false; render(); window.scrollTo(0, 0);
}
function exitCards(){ stopAudio(); cardQ = null; cardFlip = false; render(); }
function flip(){ cardFlip = !cardFlip; render(); }
function speakWord(){ const v = cardQ && cardQ[0]; if(v) speakText(v.word + '.\n' + (v.example || '')); }
function grade(ok){
  stopAudio();
  const v = cardQ.shift(), c = S.cards[v.word], today = dstr();
  if(ok){ c.box = Math.min(5, c.box + 1); c.due = addDays(today, CONFIG.leitnerDays[c.box - 1]); }
  else { c.box = 1; c.due = today; cardQ.push(v); }
  S.activity[today] = (S.activity[today] || 0) + 1;
  cardFlip = false;
  if(!cardQ.length){ cardQ = null; planAuto('cards'); toast(t('cardsDone')); }
  save(); render();
}

async function saveJsonFile(name, text){
  const file = new File([text], name, { type:'application/json' });
  try{
    if(matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); return; }
  }catch(e){ if(e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function exportData(){
  await saveJsonFile(`kstep-backup-${dstr()}.json`, JSON.stringify({ app:'kstep-prep', exportedAt:new Date().toISOString(), state:S }, null, 2));

function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result), st = j.state || j;
      if(!st || typeof st !== 'object' || !Array.isArray(st.attempts)) throw new Error('bad');
      if(!confirm(t('importConfirm'))) return;
      localStorage.setItem(STORE_KEY, JSON.stringify(st));
      S = loadState(); applyTheme(); syncCards(); render(); toast(t('imported'));
    }catch(e){ toast(t('importBad')); }
  };
  r.readAsText(file);
}

/* =========================================================
   12) FRIENDS / SQUADS — Phase A (online only, async, no polling)
   ========================================================= */
const ID_KEY = 'kstep-identity-v1', PENDING_KEY = 'kstep-pending-v1', JOIN_KEY = 'kstep-join-code', SEL_KEY = 'kstep-squad-sel';
const CODE_RE = /^[A-HJ-NP-Z2-9]{5}$/;
let ID = loadIdentity();
const F = { loading:false, busy:false, err:'', data:null, at:0, editing:false, cheerTo:null };
let FCACHE = {}, flushing = false;

function loadIdentity(){ try{ const j = JSON.parse(localStorage.getItem(ID_KEY) || 'null'); return j && j.playerId && j.token ? j : null; }catch(e){ return null; } }
function saveIdentity(){ if(ID) localStorage.setItem(ID_KEY, JSON.stringify(ID)); else localStorage.removeItem(ID_KEY); }
function randStr(n){ const abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', b = new Uint8Array(n); crypto.getRandomValues(b); return Array.from(b, x => abc[x % 62]).join(''); }
function cleanName(s, max){ return String(s || '').replace(/[\u0000-\u001F\u007F<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, max); }
function apiError(code){ const e = new Error(code); e.code = code; return e; }
function errMsg(e){ const c = (e && e.code) || 'SERVER', k = 'err_' + c, s = t(k); return s === k ? t('err_SERVER') + ' (' + c + ')' : s; }
const socialReady = () => !!(CONFIG.apiUrl && ID && ID.registered);

/* Central API call: POST text/plain (no CORS preflight), 8s timeout, 1 retry on network/busy */
async function api(action, payload = {}, retries = 1){
  if(!CONFIG.apiUrl) throw apiError('NO_API');
  if(!navigator.onLine) throw apiError('OFFLINE');
  const body = JSON.stringify({ action, payload, auth: ID ? { playerId:ID.playerId, token:ID.token } : null });
  let last = apiError('NETWORK');
  for(let i = 0; i <= retries; i++){
    const ctrl = new AbortController(), tm = setTimeout(() => ctrl.abort(), CONFIG.social.timeoutMs);
    try{
      const r = await fetch(CONFIG.apiUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body, signal:ctrl.signal, redirect:'follow', cache:'no-store' });
      clearTimeout(tm);
      if(!r.ok) throw apiError('NETWORK');
      const j = await r.json();
      if(j && j.ok) return j.data;
      throw apiError((j && j.error) || 'SERVER');
    }catch(e){
      clearTimeout(tm);
      if(e.code && e.code !== 'NETWORK' && e.code !== 'BUSY') throw e;   // real server answer → do not retry
      last = e.code ? e : apiError('NETWORK');
    }
    if(i < retries) await new Promise(res => setTimeout(res, 700));
  }
  throw navigator.onLine ? last : apiError('OFFLINE');
}

/* ---- Offline queue of answered questions (server re-checks every answer) ---- */
function getPending(){ try{ const a = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function setPending(a){ if(a.length) localStorage.setItem(PENDING_KEY, JSON.stringify(a.slice(-CONFIG.social.pendingMax))); else localStorage.removeItem(PENDING_KEY); }
function queuePractice(items){
  if(!socialReady()) return;
  const a = getPending();
  items.forEach(it => { if(it.a !== undefined) a.push({ id:it.id, a:it.a }); });
  setPending(a);
}
function afterPracticeSync(){
  if(!socialReady() || !getPending().length) return;
  if(!navigator.onLine){ toast(t('queuedOffline')); return; }
  flushPending(false);
}
async function flushPending(silent){
  if(flushing || !socialReady() || !navigator.onLine || !getPending().length) return;
  flushing = true;
  let added = 0, capped = false, cap = 0, err = null;
  try{
    let q = getPending();
    while(q.length){
      const batch = q.slice(0, CONFIG.social.syncBatch);
      const r = await api('syncPractice', { items:batch });
      added += r.added || 0; capped = capped || !!r.capped; cap = r.today ? r.today.cap : cap;
      setPending(getPending().slice(batch.length));
      q = getPending();
    }
    FCACHE = {};
  }catch(e){
    err = e;
    if(e.code === 'NOT_REGISTERED' && ID){ ID.registered = false; saveIdentity(); }
  }
  flushing = false;
  if(!silent){
    if(err) toast(errMsg(err));
    else toast(added ? t('synced', added) + (capped ? ' · ' + t('syncedCap', cap) : '') : capped ? t('syncedCap', cap) : t('syncedZero'));
  }
  if(view === 'friends') render();
}

/* ---- Loading squad data (only on open / refresh / after actions) ---- */
async function friendsEnter(force){
  if(!socialReady() || !navigator.onLine){ if(view === 'friends') render(); return; }
  await flushPending(true);
  const jc = localStorage.getItem(JOIN_KEY);
  if(jc){
    localStorage.removeItem(JOIN_KEY);
    if(confirm(t('joinConfirm', jc))){ await joinSquad(jc); return; }
  }
  await loadSquad(localStorage.getItem(SEL_KEY) || '', !!force);
}
async function loadSquad(code, force){
  const key = code || '_', c = FCACHE[key];
  if(!force && c && Date.now() - c.at < CONFIG.social.cacheMs){ setFData(c.data); if(view === 'friends') render(); return; }
  F.loading = true; F.err = ''; if(view === 'friends') render();
  try{ const d = await api('squadState', { code }); setFData(d); FCACHE[key] = { at:Date.now(), data:d }; }
  catch(e){ F.err = e.code || 'SERVER'; if(e.code === 'NOT_REGISTERED' && ID){ ID.registered = false; saveIdentity(); } }
  F.loading = false; if(view === 'friends') render();
}
function setFData(d){
  F.data = d; F.at = Date.now(); F.err = '';
  const code = d.squad ? d.squad.code : '';
  FCACHE[code || '_'] = { at:F.at, data:d };
  if(code) localStorage.setItem(SEL_KEY, code); else localStorage.removeItem(SEL_KEY);
  if(d.profile && ID){ ID.name = d.profile.name; ID.avatar = d.profile.avatar; ID.hideRank = !!d.profile.hideRank; ID.registered = true; saveIdentity(); }
}
async function fAction(fn){
  if(F.busy) return;
  F.busy = true; if(view === 'friends') render();
  try{ await fn(); }catch(e){ toast(errMsg(e)); }
  F.busy = false; if(view === 'friends') render();
}

async function doRegister(){
  const name = cleanName($('#fName').value, CONFIG.social.nameMax);
  const av = (document.querySelector('input[name=av]:checked') || {}).value;
  if(!name){ toast(t('err_NAME_INVALID')); return; }
  if(!av){ toast(t('err_AVATAR_INVALID')); return; }
  if(!ID) ID = { playerId:'p_' + randStr(20), token:randStr(40), registered:false, hideRank:false };
  ID.name = name; ID.avatar = av; saveIdentity();
  const wasNew = !ID.registered;
  await fAction(async () => {
    const d = await api('register', { name, avatar:av, hideRank:!!ID.hideRank });
    ID.registered = true; F.editing = false; FCACHE = {}; setFData(d);
    toast(wasNew ? t('welcome', name) : t('saved'));
  });
  if(socialReady()){ const jc = localStorage.getItem(JOIN_KEY); if(jc){ localStorage.removeItem(JOIN_KEY); await joinSquad(jc); } }

function joinSquad(code){

  fAction(async () => { const d = await api('cheer', { code, toId:to, cheer:k }, 0); F.cheerTo = null; FCACHE = {}; setFData(d); toast(t('cheerSent')); });

async function syncNowBtn(){

function importIdentity(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      if(!j || j.app !== 'kstep-identity' || !/^p_[A-Za-z0-9]{16,32}$/.test(j.playerId || '') || !/^[A-Za-z0-9]{32,64}$/.test(j.token || '')) throw new Error('bad');

      FCACHE = {}; F.data = null; toast(t('idImported')); go('friends');
    }catch(e){ toast(t('idBad')); }

/* ---- Views ---- */
function relTime(ms){
  ms = Math.max(0, ms || 0);
  const s = Math.round(ms / 1000);
  if(s < 60) return t('justNow');
  let rtf;
  try{ rtf = new Intl.RelativeTimeFormat(S.settings.lang === 'th' ? 'th' : 'en', { numeric:'auto' }); }catch(e){ return Math.round(s / 60) + ' min'; }
  const m = Math.round(s / 60); if(m < 60) return rtf.format(-m, 'minute');
  const h = Math.round(m / 60); if(h < 24) return rtf.format(-h, 'hour');
  return rtf.format(-Math.round(h / 24), 'day');
}
function durText(ms){
  const h = Math.max(0, Math.floor(ms / 3600000)), d = Math.floor(h / 24);
  return d ? t('dShort', d) + ' ' + t('hShort', h % 24) : t('hShort', Math.max(1, h));
}

  return `<div class="card"><h3>👥 ${t('social')}</h3>
    ${reg ? `<p>${t('playerAs')}: <b>${esc(ID.avatar || '')} ${esc(ID.name || '')}</b></p>
    <label class="switch"><input type="checkbox" ${ID.hideRank ? 'checked' : ''} onchange="toggleHideRank(this.checked)"><span><b>${t('hideRank')}</b><br><span class="muted">${t('hideRankD')}</span></span></label>`
    : `<p class="muted">${t('needProfile')}</p>`}
    <div class="stack" style="margin-top:10px">
      ${ID ? `<button class="btn" onclick="exportIdentity()">🔑 ${t('idExport')}</button>` : ''}
      <button class="btn" onclick="document.getElementById('idFile').click()">📥 ${t('idImport')}</button>
      ${ID ? `<button class="btn" style="color:var(--bad);border-color:var(--bad)" onclick="forgetIdentity()">${t('idForget')}</button>` : ''}
    </div>
    <input type="file" id="idFile" accept="application/json,.json" hidden onchange="if(this.files[0])importIdentity(this.files[0]);this.value=''"></div>`;
}

/* =========================================================
   13) INIT
   ========================================================= */
(async function init(){
  applyTheme();
  if(window.matchMedia){ const mq = matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change', applyTheme); }
  // Invite link: ?squad=XXXXX → remember, clean URL, open Friends
  const jq = new URLSearchParams(location.search).get('squad');
  if(jq !== null){
    const c = jq.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if(CODE_RE.test(c)){ localStorage.setItem(JOIN_KEY, c); view = 'friends'; }
    history.replaceState(null, '', location.pathname);
  }
  render();
  await loadBank();
  syncCards();
  if(view === 'friends') go('friends'); else render();
  if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
  // Event-driven only (no polling): send queued answers when the phone comes back online
  window.addEventListener('online', () => { flushPending(true); if(view === 'friends') render(); });
  window.addEventListener('offline', () => { if(view === 'friends') render(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
